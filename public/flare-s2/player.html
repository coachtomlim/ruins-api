<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Quick Dungeon Challenge</title><link rel="stylesheet" href="style.css"><style>.player{width:min(100%,980px);height:100dvh;margin:auto;padding:max(8px,env(safe-area-inset-top)) 8px max(8px,env(safe-area-inset-bottom));display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;gap:7px;background:radial-gradient(circle at 50% -8%,#74285f 0,#461646 33%,#260f31 68%,#190a22 100%)}.hudline{display:flex;justify-content:space-between;gap:8px;align-items:center}.hud{display:flex;gap:6px}.pill{background:rgba(77,25,73,.72);border:1px solid rgba(255,220,185,.2);padding:7px 10px;border-radius:999px;font-size:12px;color:#fff0e5}.stage{position:relative;min-height:0;background:#100816;border:1px solid rgba(255,225,190,.22);border-radius:20px;overflow:hidden;box-shadow:0 12px 30px rgba(10,0,20,.28)}.stage canvas{width:100%;height:100%;display:block}.cover{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;padding:18px;background:linear-gradient(180deg,transparent 35%,rgba(26,7,31,.58) 78%,rgba(26,7,31,.88) 100%)}.cover[hidden]{display:none!important}.card{width:min(560px,94%);background:rgba(73,22,67,.92);border:1px solid rgba(255,222,186,.26);border-radius:22px;padding:14px 16px;text-align:center;backdrop-filter:blur(10px)}.card h1{font-size:clamp(22px,5vw,34px);margin:5px 0 6px;color:#fff1df}.card p{margin:0 0 11px;color:#e0b6cf;font-size:13px}.card button,.tools button{border:0;border-radius:999px;padding:11px 18px;font-weight:900}.card button{background:#66c9b3;color:#2a1230;min-width:130px}.tools{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}.tools button{padding:9px 13px;background:#4d194a;color:#fff0e6;border:1px solid rgba(255,222,186,.16);font-size:12px}.runstatus{text-align:center;color:#d0a3bf;font-size:11px;min-height:16px}.eyebrow{color:#f0a8cf!important}@media(max-width:600px){.player{padding-left:5px;padding-right:5px}.stage{border-radius:14px}.pill{padding:6px 8px}.cover{padding:10px}.card{padding:12px 13px}.tools button{font-size:11px;padding:8px 11px}}</style></head><body><main class="player"><div class="hudline"><div class="eyebrow">QUICK DUNGEON</div><div class="hud"><div class="pill">HP <b id="hp">100</b></div><div class="pill">🪙 <b id="gold">0</b></div><div class="pill"><b id="time">0.0</b>s</div></div></div><div class="stage" id="stage"><canvas id="scene"></canvas><div id="cover" class="cover"><div class="card"><div class="eyebrow" id="overline">LOADING</div><h1 id="headline">Preparing challenge…</h1><p id="description">Loading stock Flare room and rules.</p><button id="start" disabled>START</button></div></div></div><div class="tools"><button id="overview">Overview</button><button id="zoomin">Zoom +</button><button id="zoomout">Zoom −</button><button id="pause" disabled>Pause</button></div><div class="runstatus" id="status">Loading…</div></main><script type="module" src="player.mjs"></script></body></html>
