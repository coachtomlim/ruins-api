<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Quick Dungeon Challenge</title><link rel="stylesheet" href="style.css"><style>.player{width:min(100%,980px);margin:auto;padding:10px}.hudline{display:flex;justify-content:space-between;gap:8px;align-items:center;margin:4px 0 7px}.hud{display:flex;gap:6px}.pill{background:#151b21;border:1px solid #303b45;padding:7px 10px;border-radius:999px;font-size:12px}.stage{position:relative;width:100%;height:min(72svh,720px);min-height:430px;background:#05070a;border:1px solid #29313a;border-radius:16px;overflow:hidden}.stage canvas{width:100%;height:100%;display:block}.cover{position:absolute;inset:0;display:grid;place-items:center;background:rgba(4,6,8,.44)}.cover[hidden]{display:none!important}.card{background:rgba(12,15,19,.92);border:1px solid #38424c;border-radius:18px;padding:18px;text-align:center;max-width:82%;backdrop-filter:blur(8px)}.card h1{font-size:clamp(24px,5vw,40px)}.card button,.tools button{border:0;border-radius:999px;padding:11px 18px;font-weight:800}.card button{background:#eee7d2}.tools{display:flex;justify-content:center;gap:6px;margin-top:7px}.tools button{padding:8px 12px;background:#1b2229;color:#dce1df;font-size:12px}.runstatus{text-align:center;color:#8d979b;font-size:11px;margin-top:6px}@media(max-width:600px){.player{padding:5px}.stage{height:76svh;min-height:470px;border-radius:10px}.hudline .eyebrow{font-size:10px}.pill{padding:6px 8px}}</style></head><body><main class="player"><div class="hudline"><div class="eyebrow">QUICK DUNGEON</div><div class="hud"><div class="pill">HP <b id="hp">100</b></div><div class="pill">🪙 <b id="gold">0</b></div><div class="pill"><b id="time">0.0</b>s</div></div></div><div class="stage" id="stage"><canvas id="scene"></canvas><div id="cover" class="cover"><div class="card"><div class="eyebrow" id="overline">LOADING</div><h1 id="headline">Preparing challenge…</h1><p id="description">Loading stock Flare room and rules.</p><button id="start" disabled>START</button></div></div></div><div class="tools"><button id="overview">Overview</button><button id="zoomin">Zoom +</button><button id="zoomout">Zoom −</button><button id="pause" disabled>Pause</button></div><div class="runstatus" id="status">Loading…</div></main><script type="module" src="player.mjs"></script></body></html>
