<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#38174f"><title>Gauntlet Run</title><link rel="stylesheet" href="style.css"></head><body>
<main class="play-app"><header class="play-top"><div><div class="eyebrow">GAUNTLET RUN</div><strong id="playRoom">Preparing room…</strong></div><div class="hud"><span>HP <b id="hp">100</b></span><span>🪙 <b id="gold">0</b></span><span><b id="time">0.0</b>s</span></div></header>
<div class="play-stage" id="stage"><canvas id="scene"></canvas><div class="play-cover" id="cover"><div class="play-card"><span class="step-label" id="overline">READY</span><h1 id="headline">Your runner is ready.</h1><p id="description">The gauntlet will begin automatically.</p><button type="button" class="primary" id="start">START RUN</button></div></div></div>
<div class="play-tools"><button type="button" id="overview">OVERVIEW</button><button type="button" id="pause" disabled>PAUSE</button></div><p class="status" id="status">Loading…</p>
<div class="after-actions" id="afterActions" hidden><button type="button" id="shareRun">SHARE THIS RUN</button><a href="index.html">BUILD A GAUNTLET</a></div>
</main><script type="module" src="play.mjs"></script></body></html>
