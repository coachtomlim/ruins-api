<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>RUINS | Daily Expedition · Day 1 Proof</title><link rel="stylesheet" href="./day1.css"></head>
<body><main class="app" id="app">
  <header class="top"><div><div class="eyebrow">RUINS · DAILY EXPEDITION</div><h1 id="title">DAY 1 <span>THE AWAKENING</span></h1></div><button id="sound" type="button" aria-label="Toggle sound">Sound On</button></header>
  <section class="stats"><span>DAY <b>1 / 5</b></span><span>ROOM <b id="room">1 / 2</b></span><span>HP <b id="hp">100</b></span><span>XP <b id="xp">0</b></span><span>GOLD <b id="gold">0</b></span></section>
  <section class="view" aria-label="Authored isometric dungeon view"><canvas id="board" role="img" aria-label="Interactive authored dungeon map, control movement with arrow buttons or keyboard"></canvas><div class="overlay"><span id="statusTag" class="pill">DISCOVER</span><span id="checkpoint">Checkpoint: Room 1</span></div><span class="notice" id="notice" role="status" aria-live="polite">Move to the ancient altar and investigate.</span></section>
  <footer class="control"><div class="instructions" id="instructions">Use arrow keys or the controls to move. Enter the altar area, then select Examine.</div>
    <div class="actions"><div class="dpad" aria-label="Movement controls"><button data-direction="left" title="Move left" aria-label="Move left">←</button><div class="vertical"><button data-direction="up" title="Move up" aria-label="Move up">↑</button><button data-direction="down" title="Move down" aria-label="Move down">↓</button></div><button data-direction="right" title="Move right" aria-label="Move right">→</button></div><button id="primary" type="button">EXAMINE ALTAR</button></div>
    <div class="bottom"><span class="local">LOCAL PROOF · NON-TRANSFERABLE REWARDS</span><button id="journal" type="button">Journal / Inventory</button></div>
  </footer>
  <dialog id="journalDialog"><div class="modalHeader"><h2>Expedition Journal</h2><button id="closeJournal" type="button">Close</button></div><div id="journalBody"></div></dialog>
</main><script type="module" src="./day1-app.mjs"></script></body></html>
