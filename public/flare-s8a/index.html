<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#35163f"><title>Dungeon Runner · S8A Builder</title><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="panel-shell.css"><link rel="stylesheet" href="style.css"></head>
<body><main class="builder-shell"><header><p class="eyebrow">DUNGEON RUNNER · S8A</p><h1>Challenge a friend</h1><p>Choose the Hero-Runner and the finishing-HP goal. Your friend chooses the dungeon.</p></header><section class="builder-card" aria-labelledby="builder-heading"><h2 id="builder-heading" tabindex="-1">Create a precision challenge</h2><label>Your name<input id="sender" value="Buddy" maxlength="32" autocomplete="name"></label><label>Hero-Runner<select id="runner"></select></label><div class="runner-summary"><canvas id="builderHeroCanvas" aria-label="Animated stock Flare Hero with Wooden Club and Wooden Shield"></canvas><strong id="runnerName">Loading Hero-Runner…</strong><span id="runnerStats"></span><span id="runnerGear"></span></div><label>Target finishing HP <output id="targetValue">60%</output><input id="target" type="range" min="5" max="95" step="5" value="60"></label><p id="builderMission">GET THE HERO TO THE EXIT AT ~60% HP</p><button id="createInvite" class="primary" type="button" disabled>CREATE CHALLENGE LINK</button><div id="sharePanel" hidden><label>Four-character invitation<input id="inviteUrl" readonly></label><div class="button-row"><button id="copyInvite" type="button">COPY LINK</button><a id="openInvite" class="button" href="#">OPEN INVITATION</a></div></div><p id="builderStatus" role="status">Preparing the runners…</p></section></main><script type="module" src="builder.mjs"></script></body></html>
