openapi: 3.1.0
info:
  title: Ruins Display API
  version: 1.1.0
servers:
  - url: https://ruins-api.vercel.app
paths:
  /api/display-room:
    get:
      operationId: displayRoom
      summary: Return markdown to render an image (room, map, or transition)
      description: Returns **text/markdown** so the assistant can render the image directly.
      parameters:
        - in: query
          name: name
          required: true
          description: Name of the image, e.g., "Room 1", "Room 3", "Room3to4", "Map".
          schema:
            type: string
            examples:
              - Map
              - Room 1
              - Room 3
              - Room 4
              - Room3to4
              - Room4to3
      responses:
        "200":
          description: Markdown containing the image
          content:
            text/markdown:
              schema:
                type: string
        "400":
          description: Missing required image name
          content:
            text/plain:
              schema:
                type: string
        "404":
          description: Image not found
          content:
            text/plain:
              schema:
                type: string
