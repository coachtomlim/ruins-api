<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ruins Adventure (Playtest UI)</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: Arial, sans-serif; background: #0f1115; color: #e6e8ee; }
      .layout { display: grid; grid-template-columns: 1.5fr 1fr; gap: 12px; padding: 12px; min-height: 100vh; }
      .panel { background: #181c24; border: 1px solid #2d3442; border-radius: 8px; padding: 12px; }
      .log { height: 58vh; overflow: auto; white-space: pre-wrap; line-height: 1.45; font-size: 14px; }
      .image { width: 100%; max-height: 32vh; object-fit: contain; border: 1px solid #2d3442; border-radius: 6px; background: #0f1115; }
      .status { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 13px; }
      .status div { background: #121621; border: 1px solid #2d3442; border-radius: 6px; padding: 8px; }
      .controls { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-top: 8px; }
      input, button { background: #11151f; color: #e6e8ee; border: 1px solid #384257; border-radius: 6px; padding: 10px; font-size: 14px; }
      button { cursor: pointer; }
      .quick { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
      .quick button { padding: 8px 10px; font-size: 13px; }
      @media (max-width: 980px) { .layout { grid-template-columns: 1fr; } .log { height: 45vh; } }
    </style>
  </head>
  <body>
    <main class="layout">
      <section class="panel">
        <h1 style="margin:0 0 8px 0; font-size:22px;">Forgotten Ruin of Dark Galan</h1>
        <div id="log" class="log"></div>
        <div class="controls">
          <input id="cmd" placeholder="Type command (N, Examine shrine, Pick up item, Inventory)" />
          <button id="send">Enter</button>
        </div>
        <div id="exploreQuick" class="quick">
          <button data-cmd="N">N</button><button data-cmd="S">S</button><button data-cmd="E">E</button><button data-cmd="W">W</button>
          <button data-cmd="Inventory">Inventory</button><button data-cmd="Help">Help</button><button data-cmd="Read Journal">Read Journal</button>
          <button data-cmd="Map">Map</button><button data-cmd="Assemble">Assemble</button><button data-cmd="End">End</button>
        </div>
        <div id="prologueQuick" class="quick" style="display:none;">
          <button data-cmd="Quest">Quest</button>
          <button data-cmd="Monsters">Monsters</button>
          <button data-cmd="Offer">Offer</button>
          <button data-cmd="Negotiate">Negotiate</button>
          <button data-cmd="Bargain">Bargain</button>
          <button data-cmd="Yes">Accept</button>
        </div>
        <div id="combatQuick" class="quick" style="display:none;">
          <button data-cmd="Attack Once">Attack Once</button>
          <button data-cmd="Fight till the end">Fight till the end</button>
          <button data-cmd="Run">Run</button>
          <button id="useFog" data-cmd="Use Item Fog of Confusion">Use Fog</button>
          <button id="usePulse" data-cmd="Use Item Pulse of Calm">Use Pulse</button>
          <button id="useHeart" data-cmd="Use Item Heart Beacon">Use Heart</button>
        </div>
      </section>
      <aside class="panel">
        <img id="roomImage" class="image" alt="Room visual" />
        <p id="roomLabel" style="margin:8px 0 0 0;"></p>
        <div class="status" style="margin-top:8px;">
          <div id="stats"></div>
          <div id="location"></div>
          <div id="inventory"></div>
          <div id="journal"></div>
        </div>
      </aside>
    </main>
    <script src="/play.js"></script>
  </body>
  </html>
