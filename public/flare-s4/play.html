<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#52215f"><title>Run the Gauntlet · S4 Player</title><link rel="stylesheet" href="../flare-s3/style.css"><link rel="stylesheet" href="style.css"></head><body>
<main class="play-app" id="playApp"><header class="play-top"><div><div class="eyebrow">GAUNTLET RUN</div><strong id="playRoom">Preparing room…</strong></div><div class="hud"><span>HP <b id="hp">100</b></span><span>🪙 <b id="gold">0</b></span><span><b id="time">0.0</b>s</span></div></header>
<div class="play-stage" id="stage"><canvas id="scene"></canvas><div class="play-cover" id="cover"><div class="play-card"><div class="invite-orb" aria-hidden="true"></div><span class="step-label" id="overline">INVITATION</span><h1 id="headline"><span id="sender">Buddy</span> built a gauntlet for you.</h1><p id="description">Your runner is ready. One tap begins the challenge.</p>
<div class="player-summary" id="playerSummary"><div><span>RUNNER</span><strong id="playerRunner">Level 1 Warrior</strong></div><div><span>ROOM</span><strong id="playerRoom">Pillar Court</strong></div><div><span>DEFENCES</span><strong id="playerDefences">2 guards</strong></div><div><span>TARGET</span><strong id="playerTarget">50% HP</strong></div></div>
<button type="button" class="text-button player-stats-toggle" id="playerStatsToggle">VIEW RUNNER STATS</button><div class="stats player-stats" id="playerStats" hidden><div><span>HP</span><b id="playerHp">100</b><small>health</small></div><div><span>ATK</span><b id="playerAtk">12</b><small id="playerAtkBreak">8 + 4 weapon</small></div><div><span>DEF</span><b id="playerDef">1</b><small id="playerDefBreak">1 base</small></div></div>
<button type="button" class="primary" id="start" disabled>RUN THE GAUNTLET <span>▶</span></button></div></div></div>
<div class="play-tools"><button type="button" id="overview">OVERVIEW</button><button type="button" id="pause" disabled>PAUSE</button></div><p class="status" id="status">Loading…</p><div class="after-actions" id="afterActions" hidden><button type="button" id="shareRun">SHARE RUN</button><button type="button" id="replay">RUN AGAIN</button><a href="index.html">BUILD YOUR OWN</a></div></main><script type="module" src="play.mjs"></script></body></html>
